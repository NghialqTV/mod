<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NghĩaLQ TV</title>
<link rel="stylesheet" href="style.css">
<link rel="preload" as="image" href="assets/icons/logo.png">
</head>
<script>
async function openWithAd(url){

  // chống spam
  if(window.adLoading) return;
  window.adLoading = true;

  // mở quảng cáo
  window.open(
    "https://omg10.com/4/11023287",
    "_blank"
  );

  // delay rồi mở nội dung
  setTimeout(()=>{
    window.location.href = url;
  },1500);

  setTimeout(()=>{
    window.adLoading = false;
  },3000);
}

// ADS CHO TOÀN BỘ LINK
document.addEventListener("DOMContentLoaded",()=>{

  document.querySelectorAll("a").forEach(link=>{

    link.addEventListener("click",function(e){

      const url = this.href;

      if(!url) return;

      // bỏ qua telegram/youtube
      if(
        url.includes("t.me") ||
        url.includes("youtube.com")
      ){
        return;
      }

      e.preventDefault();

      openWithAd(url);

    });

  });

});
</script>
