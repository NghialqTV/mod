<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Chi tiết tải file</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="detail-box" id="detail"></div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

fetch("data/detail.json")
  .then(res => res.json())
  .then(list => {
    const f = list.find(x => x.id === id);
    if(!f){
      document.getElementById("detail").innerHTML = "Không tìm thấy dữ liệu";
      return;
    }

    document.getElementById("detail").innerHTML = `
      <div style="
        max-width:420px;
        margin:60px auto;
        padding:24px;
        border-radius:22px;
        background:#0f1722;
        text-align:center;
        box-shadow:0 0 40px rgba(77,163,255,.4);
      ">
        <img src="${f.icon}" style="width:120px;height:120px;border-radius:24px">
        <h2 style="color:#4da3ff">${f.name}</h2>
        <p style="color:#ccc;font-size:14px">${f.desc}</p>
        <a href="${f.download}" style="
          display:inline-block;
          margin-top:20px;
          padding:14px 26px;
          border-radius:16px;
          background:linear-gradient(135deg,#4da3ff,#1e6bff);
          color:white;
          text-decoration:none;
          font-weight:700;
        ">⬇ Tải File ${f.type.toUpperCase()}</a>
      </div>
    `;
  });
</script>

</body>
</html>
